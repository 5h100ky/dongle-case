# =============================================================================
# Snake Dongle – Firmware Configuration
# Light sensor (LDR) variant  –  no buzzer
# =============================================================================

# ── Backlight (auto-brightness driven by the light sensor) ────────────────
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=80
CONFIG_ZMK_BACKLIGHT_ON_START=y
# Auto-off on idle keeps the display dark when the dongle is not in use.
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# ── Light sensor (ADC-based LDR module on pin A0 / AIN0) ──────────────────
# Enables the Zephyr ADC subsystem used to sample the LDR voltage divider.
CONFIG_ADC=y
CONFIG_SENSOR=y
# Auto-backlight behaviour module (see firmware/src/light_sensor_backlight.c)
CONFIG_SNAKE_LIGHT_SENSOR_BACKLIGHT=y
# Polling interval in milliseconds (lower = more responsive, higher CPU use)
CONFIG_SNAKE_LIGHT_SENSOR_POLL_MS=500
# ADC reading threshold below which backlight dims  (0–4095 for 12-bit)
CONFIG_SNAKE_LIGHT_SENSOR_DIM_THRESHOLD=800
# ADC reading threshold above which backlight goes to full brightness
CONFIG_SNAKE_LIGHT_SENSOR_BRIGHT_THRESHOLD=2500

# ── Sound – DISABLED (no buzzer in this build) ────────────────────────────
CONFIG_USE_BUZZER=n

# ── Snake animation ───────────────────────────────────────────────────────
CONFIG_SNAKE_FATNESS=1
CONFIG_SNAKE_BOARD_SIZE="XL"
CONFIG_SNAKE_WALK_INTERVAL=20
CONFIG_CHECKERED_BOARD=y
CONFIG_WPM_SLOW=20
CONFIG_WPM_MEDIUM=40
CONFIG_WPM_FAST=80
CONFIG_WPM_SUPER_FAST=90

# ── Status sounds (using the light-sensor change as a subtle cue) ─────────
CONFIG_USE_STATUS_SOUND=n

# ── Display & layout ──────────────────────────────────────────────────────
CONFIG_ROTATE_DISPLAY=0
CONFIG_DEFAULT_SCREEN="snake"
CONFIG_LOGO_WALK_INTERVAL=40
CONFIG_BATTERY_SLOTS=2
CONFIG_INFO_SLOT_MODE="2-slot"
CONFIG_INFO_SLOT_1="connectivity"
CONFIG_INFO_SLOT_2="layer"

# ── Theme ─────────────────────────────────────────────────────────────────
CONFIG_SPLASH_USE_SNAKE_2=n
CONFIG_USE_BATTERY_FONT_3X5=n
CONFIG_THEME_THRESHOLD=300
CONFIG_MUTE_THRESHOLD=600
