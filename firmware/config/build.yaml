# Replace MY_KEYBOARD below with your actual ZMK keyboard shield name
# (e.g. swoop, cradio, lily58).  See https://zmk.dev/docs/development/hardware-integration/dongle
---
include:
  - board: nice_nano_v2
    shield: MY_KEYBOARD_dongle snake_adapter   # change MY_KEYBOARD
    artifact-name: snake_dongle
  - board: nice_nano_v2
    shield: MY_KEYBOARD_left                   # change MY_KEYBOARD
    artifact-name: keyboard_left
  - board: nice_nano_v2
    shield: MY_KEYBOARD_right                  # change MY_KEYBOARD
    artifact-name: keyboard_right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
